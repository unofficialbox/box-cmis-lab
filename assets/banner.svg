<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="box-cmis-lab - CMIS Browser Binding workbench">
  <title>box-cmis-lab</title>

  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#16233a"/>
    </pattern>
    <linearGradient id="boxTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbcf7"/>
      <stop offset="1" stop-color="#6aa4f2"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7de0"/>
      <stop offset="1" stop-color="#1f5fb8"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b52ab"/>
      <stop offset="1" stop-color="#083b7d"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="300" fill="#0b172a"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="6" fill="#0866d9"/>

  <!-- ================= workbench mark ================= -->
  <rect x="54" y="46" width="300" height="208" rx="28" fill="#101f35" stroke="#22304a" stroke-width="2"/>

  <!-- isometric Box -->
  <g stroke="#cfe0fb" stroke-width="1.6" stroke-linejoin="round">
    <polygon points="204,78 258,108 204,138 150,108" fill="url(#boxTop)"/>
    <polygon points="150,108 204,138 204,198 150,168" fill="url(#boxLeft)"/>
    <polygon points="204,138 258,108 258,168 204,198" fill="url(#boxRight)"/>
  </g>

  <!-- folder tree / browse hierarchy -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M204 198 V226" stroke="#9fb0c6" stroke-width="3"/>
    <path d="M150 226 H258" stroke="#3f5678" stroke-width="3"/>
    <path d="M150 226 V250" stroke="#5c9df2" stroke-width="3"/>
    <path d="M204 226 V250" stroke="#5c9df2" stroke-width="3"/>
    <path d="M258 226 V250" stroke="#5c9df2" stroke-width="3"/>

    <rect x="132" y="246" width="36" height="22" rx="4" fill="#0b172a" stroke="#8fbcf7" stroke-width="2.5"/>
    <path d="M138 246 V240 H150 L156 246" fill="#0b172a" stroke="#8fbcf7" stroke-width="2.5"/>

    <rect x="186" y="246" width="36" height="22" rx="4" fill="#0b172a" stroke="#5c9df2" stroke-width="2.5"/>
    <path d="M192 246 V240 H204 L210 246" fill="#0b172a" stroke="#5c9df2" stroke-width="2.5"/>

    <rect x="240" y="246" width="36" height="22" rx="4" fill="#0b172a" stroke="#ff6658" stroke-width="2.5"/>
    <line x1="248" y1="254" x2="268" y2="254" stroke="#ff6658" stroke-width="2"/>
    <line x1="248" y1="260" x2="262" y2="260" stroke="#ff6658" stroke-width="2"/>
  </g>

  <!-- ================= wordmark ================= -->
  <text x="410" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" letter-spacing="3.5" fill="#5c9df2" font-weight="600">CMIS BROWSER BINDING &#183; WORKBENCH</text>

  <text x="408" y="192" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="84" font-weight="800" letter-spacing="-2">
    <tspan fill="#fffefa">box-cmis-lab</tspan><tspan fill="#ff6658">.</tspan>
  </text>

  <text x="411" y="238" font-family="Georgia, 'Times New Roman', serif"
        font-size="24" font-style="italic" fill="#9fb0c6">Connect &#183; Browse &#183; Query &#183; Inspect against Box CMIS.</text>
</svg>
