<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="box-cmis-lab">
  <title>box-cmis-lab</title>
  <defs>
    <linearGradient id="labBoxTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbcf7"/>
      <stop offset="1" stop-color="#6aa4f2"/>
    </linearGradient>
    <linearGradient id="labBoxLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7de0"/>
      <stop offset="1" stop-color="#1f5fb8"/>
    </linearGradient>
    <linearGradient id="labBoxRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b52ab"/>
      <stop offset="1" stop-color="#083b7d"/>
    </linearGradient>
  </defs>

  <!-- mark plate -->
  <rect width="128" height="128" rx="28" fill="#0b172a"/>
  <rect x="0" y="0" width="128" height="6" fill="#0866d9"/>

  <!-- isometric Box -->
  <g stroke="#cfe0fb" stroke-width="1.4" stroke-linejoin="round">
    <polygon points="64,28 92,44 64,60 36,44" fill="url(#labBoxTop)"/>
    <polygon points="36,44 64,60 64,92 36,76" fill="url(#labBoxLeft)"/>
    <polygon points="64,60 92,44 92,76 64,92" fill="url(#labBoxRight)"/>
  </g>

  <!-- CMIS folder tree under the cube -->
  <g fill="none" stroke="#5c9df2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 102 H80"/>
    <path d="M64 92 V102"/>
    <path d="M48 102 V112"/>
    <path d="M80 102 V112"/>
    <rect x="42" y="110" width="12" height="8" rx="1.5" fill="#0b172a" stroke="#8fbcf7"/>
    <rect x="74" y="110" width="12" height="8" rx="1.5" fill="#0b172a" stroke="#ff6658"/>
  </g>
</svg>
